name: Bump semver tag for a repo
description: It bumps the semver tag according to the commit message. It will bump major if commit message includes [MAJOR], same for [MINOR]. By default it only bumps patch version.

inputs:
  token:
    description: Token needed for tag push
    required: true

outputs:
  new-tag:
    value: ${{ steps.bump.outputs.tag }}
    description: Newly pushed tag

runs:
  using: composite
  steps:
    - name: Bump tag
      shell: bash
      id: bump
      env:
        COMMIT_MSG: ${{ github.event.head_commit.message }}
        GITHUB_TOKEN: ${{ inputs.token }}
        BRANCH: ${{ github.ref_name }}
      run: |
        git config user.email "ci@github.com"
        git config user.name "GitHub Actions"

        git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"

        # make sure tags exist locally (checkout is shallow and tagless by default)
        git fetch --tags --force --quiet

        # only look at plain vX.Y.Z tags; "|| true" so no matches doesn't kill the script
        PREV_TAG=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)

        if [[ -z "$PREV_TAG" ]]; then
          NEW_TAG="v1.0.0"
        else
          IFS='.' read -r major minor patch <<< "${PREV_TAG#v}"
          if [[ "$COMMIT_MSG" == *"[MAJOR]"* ]]; then
            major=$((major + 1)); minor=0; patch=0
          elif [[ "$COMMIT_MSG" == *"[MINOR]"* ]]; then
            minor=$((minor + 1)); patch=0
          else
            patch=$((patch + 1))
          fi
          NEW_TAG="v${major}.${minor}.${patch}"
        fi

        # CHANGE 2: add suffix if not on main
        if [[ "$BRANCH" != "main" ]]; then
          NEW_TAG="${NEW_TAG}-${BRANCH}.${{ github.run_number }}"
        fi

        echo "Bumping $PREV_TAG -> $NEW_TAG"
        git tag "$NEW_TAG"
        git push origin "$NEW_TAG"
        echo "tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
